<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Create Account | SMSVault</title>

<link rel="stylesheet"
href="signup.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- Header -->

<header>

<div class="logo">

<div class="logo-icon">

<span></span>
<span></span>
<span></span>

</div>

<div class="logo-text">
SMSVault
</div>

</div>

<div class="header-right">

<i class="fa-regular fa-moon"></i>

<i class="fa-solid fa-bars" id="menuBtn"></i>

</div>

</header>

<!-- Register -->

<section class="register">

<h1>Create your account</h1>

<p class="subtitle">
Join SMSVault and get started
</p>

<!-- Success / Error Message -->

<div id="authMessage"></div>

<!-- Google -->

<button
id="googleSignup"
class="google-btn">

<img
src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">

<span>
Sign up with Google
</span>

</button>

<div class="divider">

<span></span>

<p>or sign up with email</p>

<span></span>

</div>

<form id="signupForm">
  <div class="name-row">

<div class="field">

<label>First name</label>

<input
type="text"
id="firstName"
placeholder="John"
required>

</div>

<div class="field">

<label>Last name</label>

<input
type="text"
id="lastName"
placeholder="Doe"
required>

</div>

</div>

<div class="field">

<label>Email</label>

<input
type="email"
id="email"
placeholder="you@example.com"
required>

</div>

<div class="field">

<label>Password</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="min. 8 characters"
required>

<button
type="button"
id="togglePassword"
class="eye-btn">

<i class="fa-regular fa-eye"></i>

</button>

</div>

</div>

<button
type="submit"
class="signup-btn">

Create account

</button>

</form>

<p class="signin-text">

Already have an account?

<a href="login.html">

Sign in

</a>

</p>

</section>
<!-- Side Menu -->

<div class="menu-overlay" id="menuOverlay">

<div class="side-menu">

<h2>Menu</h2>

<hr>

<a href="index.html">Home</a>

<a href="services.html">Services</a>

<a href="#about">About</a>

<a href="#pricing">Pricing</a>

<a href="#faq">FAQ</a>

<a href="login.html" class="menu-btn menu-white">
SIGN IN
</a>

<a href="signup.html" class="menu-btn menu-green">
CREATE ACCOUNT
</a>

</div>

</div>

<!-- Loading Screen -->

<div class="page-loader" id="pageLoader">

<div class="loader-content">

<div class="loader-logo">

<div class="logo-icon">

<span></span>

<span></span>

<span></span>

</div>

</div>

<p class="loading-text">
Please wait...
</p>

</div>

</div>

<script type="module" src="signup.js"></script>

</body>

</html>
